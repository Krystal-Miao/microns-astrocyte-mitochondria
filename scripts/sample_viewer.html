<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICrONS 小样本切片查看器</title>
<style>
body{font:16px system-ui,sans-serif;background:#101820;color:#edf4f7;margin:24px}
h1{font-size:24px}p{color:#bdced9;line-height:1.6}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding:16px;background:#1c2a36;border-radius:12px;margin-bottom:16px}
button,select,input{font:inherit}button,select{padding:7px;border-radius:6px}input[type=range]{vertical-align:middle}#z{width:260px}#slice{width:65px}
.panels{display:flex;gap:20px;flex-wrap:wrap}.panel{max-width:100%;overflow:auto;background:#080c10;border:1px solid #3b5262;border-radius:8px}.title{padding:10px;position:sticky;left:0}.frame{position:relative;line-height:0;width:512px;height:512px}.frame img{position:absolute;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}.em{filter:var(--tone)}#overlay{opacity:.45}#info,#point,#message{line-height:1.7;margin:12px 0;font-variant-numeric:tabular-nums}#message{color:#ffb8a8}.scale{position:absolute;bottom:15px;left:15px;color:white;line-height:1.4;border-bottom:4px solid white;text-shadow:0 1px 3px black;padding-bottom:4px;font-size:13px}a{color:#a6d8ff}
</style>
<h1>MICrONS · 逐层查看 EM 与 astrocyte mask</h1>
<p>左：原始 EM。右：同一层叠加目标 astrocyte（红色），不是线粒体标注。每个 sample 是一个三维小块。对比度和透明度只影响显示，不修改 TIFF。</p>
<div class="controls">
<label>小块 <select id="sample"></select></label>
<button id="prev">← 上一层</button><label>Z 层 <input id="z" type="range" min="0" value="0"><input id="slice" type="number" min="0" value="0"></label><button id="next">下一层 →</button>
<button id="best">目标面积最大的一层</button>
</div>
<div class="controls">
<label><input id="show" type="checkbox" checked> 显示红色 mask</label>
<label>透明度 <input id="alpha" type="range" min="0" max="100" value="45"></label>
<label>对比度 <input id="contrast" type="range" min="50" max="300" value="100"><span id="contrastValue">100%</span></label>
<label>放大 <select id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label>
<button id="reset">重置显示</button>
</div>
<div id="info"></div><div id="message" role="status"></div>
<div class="panels">
<div class="panel"><div class="title">原始 EM</div><div class="frame" id="leftFrame"><img class="em" id="raw" alt="原始 EM 切片"><div class="scale">1 µm</div></div></div>
<div class="panel"><div class="title">EM + 目标 astrocyte mask</div><div class="frame" id="rightFrame"><img class="em" id="base" alt="对应 EM 切片"><img id="overlay" alt="红色 astrocyte mask"></div></div>
</div>
<div id="point">点击任一图像记录位置；这里只记录坐标，不确认结构的生物学身份。</div>
<p>左右方向键切换 Z 层（不在输入控件内时）；M 键开关 mask。放大后可滚动图像。Z 从 0 开始编号。</p>
<script>
const samples=__SAMPLE_DATA__;
const $=id=>document.getElementById(id);
let active=0,z=0,generation=0;
samples.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;$('sample').append(o)});
function appearance(){document.documentElement.style.setProperty('--tone',`contrast(${$('contrast').value}%)`);$('contrastValue').textContent=$('contrast').value+'%';$('overlay').style.opacity=$('alpha').value/100;$('overlay').style.display=$('show').checked?'block':'none';const s=samples[active],zoom=Number($('zoom').value);document.querySelectorAll('.frame').forEach(f=>{f.style.width=s.shape[2]*zoom+'px';f.style.height=s.shape[1]*zoom+'px'});document.querySelector('.scale').style.width=1000/s.resolution[0]*zoom+'px'}
async function render(){const s=samples[active];z=Math.max(0,Math.min(s.shape[0]-1,Math.round(Number(z)||0)));$('z').max=$('slice').max=s.shape[0]-1;$('z').value=$('slice').value=z;const tag=String(z).padStart(3,'0'),mine=++generation;
$('info').textContent=`${s.name} | root ID: ${s.root_id} | Z = ${z} / ${s.shape[0]-1} | 这一层目标占比 ${(s.occupancy[z]*100).toFixed(2)}% | XYZ 分辨率 ${s.resolution.join(' × ')} nm`;
$('message').textContent='加载切片…';document.querySelectorAll('.frame').forEach(f=>f.style.visibility='hidden');
try{const images=await Promise.all(['em','mask'].map(kind=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('无法读取切片文件，请保留 index.html 旁的 sample 文件夹。'));im.src=`${s.name}/${kind}_${tag}.png`})));
if(mine!==generation)return;$('raw').src=$('base').src=images[0].src;$('overlay').src=images[1].src;appearance();document.querySelectorAll('.frame').forEach(f=>f.style.visibility='visible');$('message').textContent='';}catch(e){if(mine===generation)$('message').textContent=e.message}}
$('sample').onchange=()=>{active=Number($('sample').value);z=samples[active].start;$('point').textContent='点击图像记录当前样本的位置。';render()};
$('z').oninput=()=>{z=$('z').value;render()};$('slice').onchange=()=>{z=$('slice').value;render()};$('prev').onclick=()=>{z--;render()};$('next').onclick=()=>{z++;render()};$('best').onclick=()=>{z=samples[active].start;render()};
['show','alpha','contrast','zoom'].forEach(id=>$(id).addEventListener('input',appearance));$('reset').onclick=()=>{$('contrast').value=100;$('alpha').value=45;$('show').checked=true;$('zoom').value=1;appearance()};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();z+=e.key==='ArrowLeft'?-1:1;render()}if(e.key.toLowerCase()==='m'){$('show').checked=!$('show').checked;appearance()}});
document.querySelectorAll('.frame').forEach(f=>f.addEventListener('click',e=>{if($('message').textContent)return;const s=samples[active],r=f.getBoundingClientRect(),x=Math.min(s.shape[2]-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*s.shape[2]))),y=Math.min(s.shape[1]-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*s.shape[1])));const world=[x,y,z].map((v,i)=>((v+s.origin[i])*s.resolution[i]/1000).toFixed(3));$('point').textContent=`记录位置：${s.name} | 局部 XYZ = (${x}, ${y}, ${z}) | 全局 XYZ = (${world.join(', ')}) µm。可复制这行作为候选位置记录。`}));
z=samples[0].start;render();
</script>
</html>
